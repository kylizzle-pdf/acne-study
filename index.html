<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acne Study Cards and Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-first column; a flip card or a question card is the single focus, controls sit above and below it */
  --bg:#FFFFFF; --surface:#F7F5F9; --ink:#1E1B22; --muted:#6B6573; --line:#E5E1EA;
  --accent:#5C4073; --accent-ink:#FFFFFF; --tint:#F0EBF5;
  --good:#2F7A4F; --good-bg:#E7F3EC; --bad:#B3261E; --bad-bg:#FBEAE8;
  --font:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141A; --surface:#201D25; --ink:#F1EEF4; --muted:#A8A1B1; --line:#34303B;
    --accent:#B89BD2; --accent-ink:#1A1520; --tint:#2A2433;
    --good:#7CC79B; --good-bg:#1E2E25; --bad:#F2A49C; --bad-bg:#3A2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16141A; --surface:#201D25; --ink:#F1EEF4; --muted:#A8A1B1; --line:#34303B;
  --accent:#B89BD2; --accent-ink:#1A1520; --tint:#2A2433;
  --good:#7CC79B; --good-bg:#1E2E25; --bad:#F2A49C; --bad-bg:#3A2220;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs a{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);color:var(--accent);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--tint);color:var(--accent)}
.progress{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.ptext{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
/* flip card */
.card{perspective:1200px;cursor:pointer;min-height:340px;border:0;background:none;padding:0;width:100%;font:inherit;color:inherit;text-align:left}
.card .inner{display:grid;width:100%;min-height:340px;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:340px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.face.back{transform:rotateY(180deg);background:var(--tint);border-color:var(--accent)}
.face .ch{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.face .txt{font-size:22px;font-weight:600;line-height:1.3;flex:1;display:flex;align-items:center;text-wrap:balance}
.face.back .txt{font-size:18px;font-weight:500}
.face img{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.face .hint{font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:inherit;font-weight:600;font-size:16px;min-height:48px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.learn{border-color:var(--bad);color:var(--bad)}
.btn.got{border-color:var(--good);color:var(--good)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px 0}
.done{border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .big{font-size:40px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
/* quiz */
.q{border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--accent)}
.q h2{font-size:19px;line-height:1.35;margin:0;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:inherit;font-size:16px;text-align:left;padding:12px 14px;min-height:48px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-weight:700;color:var(--muted);min-width:18px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--ink);font-size:15px}
.why b{display:block;margin-bottom:2px}
.missed{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.missed div{border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.missed .ans{color:var(--good);font-weight:600}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: reduce){.card .inner,.bar span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Acne study</h1>
    <p class="sub">Flash cards and a quiz built from the acne course.</p>
  </header>
  <nav class="tabs" aria-label="Study mode">
    <a href="#cards" id="tab-cards">Flash cards</a>
    <a href="#quiz" id="tab-quiz">Quiz</a>
  </nav>

  <section id="view-cards" aria-label="Flash cards">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <p class="label">Chapter</p>
        <div class="chips" id="card-chips"></div>
      </div>
      <div class="row">
        <div class="seg" role="group" aria-label="Card mode">
          <button type="button" id="mode-learn" aria-pressed="true">Learn</button>
          <button type="button" id="mode-browse" aria-pressed="false">Browse</button>
        </div>
        <button type="button" class="link" id="reset-cards">Reset progress</button>
      </div>
      <div class="progress">
        <div class="bar"><span id="card-bar"></span></div>
        <div class="ptext" id="card-ptext"></div>
      </div>
      <div id="card-area"></div>
    </div>
  </section>

  <section id="view-quiz" aria-label="Quiz" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <p class="label">Chapter</p>
        <div class="chips" id="quiz-chips"></div>
      </div>
      <label class="switch" for="sc-only"><input type="checkbox" id="sc-only"> Client scenarios only</label>
      <div id="quiz-area"></div>
    </div>
  </section>

  <footer>Progress is saved in this browser on this device. Based on the course, the AAD 2024 acne guidelines, DermNet and the studies linked in the doc.</footer>
</div>

<script>
const DATA = {"chapters": ["Skin biology", "Breakout drivers", "How acne forms", "Acne vs lookalikes", "Hormones", "Fitzpatrick and PIH", "Treatment room", "Picture cards"], "cards": [{"ch": "Skin biology", "f": "What is acne, in medical terms?", "b": "A chronic inflammatory disorder of the pilosebaceous unit, which is the hair follicle plus its oil gland."}, {"ch": "Skin biology", "f": "What are the four pillars of acne?", "b": "Too much sebum, dead cells clogging the follicle, microbial imbalance, and inflammation. They feed off each other."}, {"ch": "Skin biology", "f": "Follicular hyperkeratinization", "b": "Dead cells stick together and pile up inside the follicle instead of shedding normally. It's how the plug starts."}, {"ch": "Skin biology", "f": "Why does squalene matter in acne?", "b": "When the squalene in sebum oxidizes, it sets off inflammation and weakens the follicle wall."}, {"ch": "Skin biology", "f": "Microbiota vs microbiome", "b": "Microbiota is the organisms themselves. Microbiome is the organisms plus everything they're doing."}, {"ch": "Skin biology", "f": "What was C. acnes called before?", "b": "P. acnes (Propionibacterium acnes). It was renamed after genetic work put it in its own group."}, {"ch": "Skin biology", "f": "Is C. acnes the bad guy?", "b": "Not by itself. It lives in everyone's follicles and is normally protective. Acne is about which strains take over and how they behave."}, {"ch": "Skin biology", "f": "Which C. acnes type shows up most in acne?", "b": "IA1. Acne skin also tends to lose its strain variety."}, {"ch": "Skin biology", "f": "Biofilm", "b": "A protective layer bacteria build around themselves. It shields them from treatment and helps acne hang on."}, {"ch": "Skin biology", "f": "CAMP factors", "b": "Proteins released by inflammatory C. acnes strains that crank up the immune response."}, {"ch": "Skin biology", "f": "Why does C. acnes thrive in a clogged pore?", "b": "It prefers low oxygen, and a sealed, plugged follicle cuts the oxygen off."}, {"ch": "Skin biology", "f": "What's the goal with acne bacteria?", "b": "Rebalance them, don't wipe them out."}, {"ch": "Skin biology", "f": "Dermal-epidermal junction and dark marks", "b": "When inflammation hits the junction between layers, pigment and inflammatory signals get pushed deeper. That's where PIH comes from."}, {"ch": "Breakout drivers", "f": "The three buckets of breakout drivers", "b": "Internal (genetics, hormones, stress, gut-skin axis), external (occlusion, friction, environment, products) and lifestyle (sleep, hygiene, sweat, blood sugar)."}, {"ch": "Breakout drivers", "f": "What does poor sleep do to skin?", "b": "Raises inflammatory markers like IL-6 and TNF-alpha, weakens the barrier and slows repair."}, {"ch": "Breakout drivers", "f": "When does skin do most of its repair?", "b": "At night, especially in deep sleep, when cortisol drops and melatonin and growth signals go up."}, {"ch": "Breakout drivers", "f": "How do high glycemic foods feed acne?", "b": "They raise insulin, which raises IGF-1, which pushes more oil, more androgen activity and more inflammation."}, {"ch": "Breakout drivers", "f": "What does Laron syndrome teach us about acne?", "b": "People who barely make IGF-1 don't get acne, and giving them IGF-1 brings it on. IGF-1 matters."}, {"ch": "Breakout drivers", "f": "Did the 2024 AAD guidelines make diet rules?", "b": "No. They said the evidence on diet is still too thin for official recommendations."}, {"ch": "How acne forms", "f": "What is the very first acne lesion?", "b": "The microcomedone: a tiny plug of dead cells and oil that you can't see yet."}, {"ch": "How acne forms", "f": "Why do acne results take 8 to 12 weeks?", "b": "Today's breakouts started forming as microcomedones weeks before the client walked in."}, {"ch": "How acne forms", "f": "Infundibulum", "b": "The funnel-shaped opening of the follicle. It sits at an angle, so debris collects there and starts the plug."}, {"ch": "How acne forms", "f": "What comes out during an extraction?", "b": "Dead cells, sebum, bacteria and white blood cells."}, {"ch": "How acne forms", "f": "Why is a blackhead black?", "b": "Melanin and oxidized oil at the open end of the plug. It's not dirt."}, {"ch": "How acne forms", "f": "Whitehead vs blackhead", "b": "Whitehead: the opening stays closed under a thin layer of skin. Blackhead: the opening stretches wide and the plug is exposed to air."}, {"ch": "How acne forms", "f": "Follicle intact vs follicle ruptured", "b": "Intact means comedones (not inflamed). Ruptured means papules, pustules, nodules or cysts."}, {"ch": "How acne forms", "f": "Papule", "b": "A red, raised, tender bump with no head, under 5 mm across. Don't extract it."}, {"ch": "How acne forms", "f": "Pustule", "b": "A red base with a white or yellow center of pus, under 5 mm across."}, {"ch": "How acne forms", "f": "Nodule", "b": "A deep, firm, painful lesion 5 mm or bigger. High scar risk. Never extract it, and refer."}, {"ch": "How acne forms", "f": "The newer view on when inflammation starts", "b": "Inflammatory signals like IL-1 show up around follicles before the plug even forms, so all acne counts as inflammatory."}, {"ch": "How acne forms", "f": "Why use anti-inflammatories at every stage?", "b": "They calm the redness now and lower the chance of dark marks later."}, {"ch": "Acne vs lookalikes", "f": "What's the signature of true acne?", "b": "Comedones: blackheads and whiteheads. No comedones at all means think lookalike."}, {"ch": "Acne vs lookalikes", "f": "Acne mechanica", "b": "Breakouts from heat, friction, pressure or trapped sweat, right where gear touches: masks, straps, helmets, phones."}, {"ch": "Acne vs lookalikes", "f": "Clues for fungal acne (Malassezia folliculitis)", "b": "Itchy, same-size bumps, no comedones, usually chest, back or forehead, often after antibiotics or heat, and acne products don't help. Refer."}, {"ch": "Acne vs lookalikes", "f": "Acne cosmetica", "b": "A slow build-up of closed comedones from heavy or pore-clogging products. The fix is a product review."}, {"ch": "Acne vs lookalikes", "f": "Clues for drug-induced acne", "b": "Sudden, same-size bumps with no comedones, soon after starting a new medication or supplement. Refer to the prescriber."}, {"ch": "Acne vs lookalikes", "f": "Milia", "b": "Firm, white keratin cysts, often around the eyes. Acne products do nothing. They're removed by extraction, if your license allows."}, {"ch": "Acne vs lookalikes", "f": "Sebaceous filaments", "b": "Small, even gray dots on the nose that are a normal part of the pore lining and refill quickly. Not blackheads."}, {"ch": "Acne vs lookalikes", "f": "How is rosacea different from acne?", "b": "Central redness, flushing, visible blood vessels and burning or stinging, with no comedones. Usually starts between 30 and 60."}, {"ch": "Acne vs lookalikes", "f": "Perioral dermatitis", "b": "Tiny bumps around the mouth and nose with a clear rim at the lip line, often linked to steroid creams. No comedones. Refer."}, {"ch": "Hormones", "f": "What runs the oil glands?", "b": "Androgens."}, {"ch": "Hormones", "f": "What do most hormonal acne clients' labs look like?", "b": "Normal. Their follicles are just extra sensitive to normal hormone levels."}, {"ch": "Hormones", "f": "DHT", "b": "The strongest androgen in skin. The enzyme 5-alpha reductase makes it from testosterone."}, {"ch": "Hormones", "f": "Where does hormonal acne show up, and what's it like?", "b": "Jawline, chin and neck. Deep, tender, cyclical and slow to heal."}, {"ch": "Hormones", "f": "Luteal phase breakouts", "b": "After ovulation, estrogen drops and progesterone takes over, so androgens have more pull. Breakouts hit 3 to 10 days before the period."}, {"ch": "Hormones", "f": "Best window for stronger corrective treatments", "b": "The follicular phase: the week or so after the period starts, when estrogen climbs back and skin calms down."}, {"ch": "Hormones", "f": "PCOS and SHBG", "b": "High insulin lowers SHBG, the protein that ties up testosterone, so more free testosterone reaches the oil glands."}, {"ch": "Hormones", "f": "What does estrogen do for skin?", "b": "It's protective and calms the oil glands."}, {"ch": "Hormones", "f": "What does cortisol do in acne?", "b": "It usually doesn't start acne, but it makes it worse, slows healing and makes skin more reactive."}, {"ch": "Hormones", "f": "Perimenopause skin", "b": "Estrogen drops unevenly, androgens have a bigger effect, skin gets more reactive and repairs slower. Go gentler."}, {"ch": "Fitzpatrick and PIH", "f": "What does Fitzpatrick type predict with acne?", "b": "How skin reacts to inflammation and heals: lighter types tend to go red, higher types tend to leave dark marks."}, {"ch": "Fitzpatrick and PIH", "f": "PIH", "b": "Post-inflammatory hyperpigmentation: dark marks left by inflammation. More common and longer-lasting in Fitzpatrick IV to VI."}, {"ch": "Fitzpatrick and PIH", "f": "What makes PIH worse?", "b": "Picking, aggressive extractions, over-exfoliating, repeated breakouts and sun."}, {"ch": "Fitzpatrick and PIH", "f": "The two easiest PIH rules to drill into clients", "b": "Sunscreen every day, and no picking."}, {"ch": "Fitzpatrick and PIH", "f": "Keloid risk in skin of color", "b": "Roughly 5 to 16 times more likely to form keloid scars."}, {"ch": "Treatment room", "f": "The 80/20 rule", "b": "Home care is 80% of results and the treatment room is 20%."}, {"ch": "Treatment room", "f": "The three boxes every plan should check", "b": "Reduce inflammation, control acne bacteria, and support skin function and the barrier."}, {"ch": "Treatment room", "f": "What does barrier first mean?", "b": "Calm and stabilize a compromised barrier before any corrective work. You won't get results while the skin is angry."}, {"ch": "Treatment room", "f": "Treatments with the strongest support (AAD 2024)", "b": "Benzoyl peroxide, topical retinoids, topical antibiotics and oral doxycycline. le is exactly that."}, {"ch": "Breakout drivers", "sc": true, "q": "A client works night shifts, sleeps about 5 hours, and her skin is redder and breaking out more than usual. Which driver matters most here?", "o": ["Diet", "Poor sleep and a thrown-off skin clock", "Her Fitzpatrick type", "A new product"], "a": 1, "w": "Sleep loss raises inflammatory markers like IL-6 and TNF-alpha and slows barrier repair. Treat sleep as a real factor."}, {"ch": "Breakout drivers", "q": "How does a high glycemic diet mainly affect acne?", "o": ["It raises insulin and IGF-1", "It adds dirt to pores", "It dries out the skin", "It kills good bacteria"], "a": 0, "w": "Insulin raises IGF-1, which boosts oil, androgen activity and inflammation."}, {"ch": "How acne forms", "q": "What's the earliest acne lesion?", "o": ["Microcomedone", "Whitehead", "Papule", "Pustule"], "a": 0, "w": "Every breakout starts as an invisible microcomedone weeks before it shows."}, {"ch": "How acne forms", "q": "What makes a blackhead black?", "o": ["Dirt", "Melanin and oxidized oil", "Dried blood", "Bacteria"], "a": 1, "w": "The open end of the plug holds melanin and oxidized oil. Busting the dirt myth builds trust."}, {"ch": "How acne forms", "q": "A red, tender bump with no head, smaller than 5 mm, is a:", "o": ["Pustule", "Nodule", "Papule", "Closed comedone"], "a": 2, "w": "A papule is inflamed and raised with no pus. Don't extract it."}, {"ch": "How acne forms", "sc": true, "q": "Two weeks into a new routine, a client asks why her skin isn't clear yet. What's the best answer?", "o": ["Today's breakouts started forming weeks ago, so give it 8 to 12 weeks", "She should switch products right away", "She needs extractions every week", "This routine will never work for her"], "a": 0, "w": "Microcomedones form weeks ahead of visible breakouts, so results lag. Consistency beats switching."}, {"ch": "How acne forms", "q": "Which lesion should you never try to extract?", "o": ["An open comedone", "A nodule", "A closed comedone near the surface", "A blackhead on the nose"], "a": 1, "w": "Nodules rupture deep in the dermis. Squeezing pushes inflammation deeper and raises scar risk. Refer."}, {"ch": "Acne vs lookalikes", "q": "What's the single best clue that it's true acne?", "o": ["Itching", "Comedones", "Redness", "Pustules"], "a": 1, "w": "Comedones are the signature of acne. Lookalikes like fungal acne, rosacea and perioral dermatitis don't have them."}, {"ch": "Acne vs lookalikes", "sc": true, "q": "\"These bumps on my chest itch like crazy. They started after I took antibiotics, and my benzoyl peroxide wash hasn't helped in two months.\" The bumps are all the same size with no blackheads. What's most likely?", "o": ["Hormonal acne", "Fungal acne (Malassezia folliculitis)", "Acne cosmetica", "Rosacea"], "a": 1, "w": "Itch, uniform bumps, no comedones, recent antibiotics and no response to acne products all point to fungal acne. Refer for antifungal treatment."}, {"ch": "Acne vs lookalikes", "sc": true, "q": "A client plays softball and only breaks out exactly where her helmet strap sits. What is it?", "o": ["Acne mechanica", "Drug-induced acne", "Perioral dermatitis", "Milia"], "a": 0, "w": "Breakouts that follow the shape of gear come from friction, pressure and trapped sweat."}, {"ch": "Acne vs lookalikes", "sc": true, "q": "\"I have these hard little white dots under my eyes, and salicylic acid hasn't touched them.\" What are they most likely?", "o": ["Whiteheads", "Milia", "Sebaceous filaments", "Fungal acne"], "a": 1, "w": "Milia are keratin cysts with no oil or bacteria, so acne products do nothing. They come out by extraction, within your license."}, {"ch": "Acne vs lookalikes", "sc": true, "q": "A 42-year-old client has redness across her cheeks and nose, flushes with wine and heat, says products sting, and has some papules but no blackheads. What should you suspect?", "o": ["Hormonal acne", "Acne cosmetica", "Rosacea", "Acne mechanica"], "a": 2, "w": "Central redness, flushing, stinging and no comedones point to rosacea. Go gentle and refer for prescription options."}, {"ch": "Acne vs lookalikes", "sc": true, "q": "A client has tiny bumps around her mouth and nose with a clear rim right at the lip line, and she's been putting hydrocortisone cream on them. What's the right move?", "o": ["Tell her to stop the cream today", "Extract the bumps", "Suspect perioral dermatitis and send her to her doctor before she stops the cream", "Start a strong acne peel"], "a": 2, "w": "Steroid creams are a common trigger, and stopping them usually causes a rebound flare, so the doctor should guide it."}, {"ch": "Acne vs lookalikes", "sc": true, "q": "Three weeks after starting a new prescription, a client gets a sudden crop of same-size bumps on his chest with no comedones. What do you do?", "o": ["Tell him to stop the medication", "Suspect drug-induced acne and refer him to the prescriber", "Do a deep extraction facial", "Assume it's diet"], "a": 1, "w": "Sudden, uniform bumps right after a new medication point to drug-induced acne. Never tell a client to stop a prescription."}, {"ch": "Hormones", "q": "Which hormones run the oil glands?", "o": ["Androgens", "Estrogen", "Melatonin", "Thyroid hormone"], "a": 0, "w": "Androgens, especially DHT in the skin, drive sebum production."}, {"ch": "Hormones", "q": "Where does hormonal acne usually show up?", "o": ["Forehead and nose", "Jawline, chin and neck", "Back of the arms", "Around the eyes"], "a": 1, "w": "Hormonal acne is deep, tender and cyclical along the lower face and neck."}, {"ch": "Hormones", "sc": true, "q": "A client breaks out the week before her period every month. When should you schedule her stronger corrective treatment?", "o": ["The week before her period", "During her flare", "The week or so after her period starts", "It doesn't matter"], "a": 2, "w": "The follicular phase, after the period starts, is when estrogen climbs back and skin calms down. Use the week before for calming facials."}, {"ch": "Hormones", "q": "In PCOS, what does high insulin do?", "o": ["Raises SHBG, so less testosterone is free", "Lowers SHBG, so more free testosterone reaches the oil glands", "Has no effect on acne", "Raises estrogen"], "a": 1, "w": "Less SHBG means more free testosterone, even when total testosterone looks normal."}, {"ch": "Hormones", "sc": true, "q": "A 25-year-old client has had stubborn jawline acne for years, periods every two to three months, and new dark hairs on her chin. What's your best move?", "o": ["Tell her she has PCOS", "Gently suggest she talk to her doctor about her periods, and keep treating gently", "Ignore it and do extractions", "Recommend a supplement"], "a": 1, "w": "These signs point toward PCOS, but you can't diagnose it. Bring it up gently and refer, and keep supporting her skin."}, {"ch": "Hormones", "q": "What do most adult women with acne have?", "o": ["High testosterone on labs", "Normal hormone labs with extra-sensitive follicles", "Low estrogen on labs", "Thyroid disease"], "a": 1, "w": "Most have normal labs. Their oil glands are just more sensitive to normal levels."}, {"ch": "Fitzpatrick and PIH", "sc": true, "q": "A Fitzpatrick V client wants an aggressive peel to clear her dark marks fast. What's the best approach?", "o": ["Do the strongest peel you offer", "Go conservative: control inflammation, daily sunscreen, gentle brighteners, build up slowly", "Tell her the marks will never fade", "Do aggressive extractions first"], "a": 1, "w": "Aggressive treatments can create more inflammation and more pigment in darker skin. Slow and steady wins here."}, {"ch": "Fitzpatrick and PIH", "q": "Which of these makes PIH worse?", "o": ["Daily sunscreen", "Picking at breakouts", "Barrier support", "Calming treatments"], "a": 1, "w": "Picking adds inflammation, which tells melanocytes to make more pigment."}, {"ch": "Fitzpatrick and PIH", "q": "In lighter skin types, inflammation more often fades as:", "o": ["Dark brown marks", "Redness", "Keloids", "Milia"], "a": 1, "w": "Lighter skin tends to go red after inflammation. Higher Fitzpatrick types tend to go dark."}, {"ch": "Treatment room", "q": "What does the 80/20 rule mean?", "o": ["The treatment room is 80% of results", "Home care is 80% of results", "80% of clients need a referral", "Use 80% less product"], "a": 1, "w": "Home care drives most of the results, which is why a simple routine the client actually follows matters so much."}, {"ch": "Treatment room", "sc": true, "q": "A client's skin stings with every product after a month of using five different actives. What comes first?", "o": ["A stronger peel", "Barrier first: strip the routine back to cleanser, moisturizer and sunscreen", "More extractions", "Add another active"], "a": 1, "w": "You won't get results while the skin is angry. Calm and stabilize, then add actives back one at a time."}, {"ch": "Treatment room", "sc": true, "q": "A client finished isotretinoin two months ago and wants her brows waxed today. What should you do?", "o": ["Wax as usual", "Skip the wax, tweeze instead, and check with her dermatologist about other procedures", "Wax with extra pressure", "Do a peel first"], "a": 1, "w": "Skin can tear and heal poorly after isotretinoin. Most spas wait about 6 months to wax, and her dermatologist decides on procedures."}, {"ch": "Treatment room", "q": "Which treatments got the strongest support in the 2024 AAD guidelines?", "o": ["Benzoyl peroxide, topical retinoids, topical antibiotics, oral doxycycline", "Diet changes and supplements", "Chemical peels and lasers", "Tea tree oil and clay masks"], "a": 0, "w": "Those four got the strongest recommendations. Isotretinoin is for severe or scarring acne."}, {"ch": "Treatment room", "q": "Which of these is a clear reason to refer?", "o": ["A few blackheads", "Deep nodules or scarring", "Oily T-zone", "Sebaceous filaments"], "a": 1, "w": "Nodules, cysts and scarring need prescription treatment from a dermatologist."}]};
const KEY = "acneStudy.v1";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
const store = Object.assign({boxes:{}, best:{}}, load());
const cards = DATA.cards.map((c,i)=>Object.assign({id:"c"+i}, c));
const quiz = DATA.quiz.map((q,i)=>Object.assign({id:"q"+i}, q));
const ALL = "All";
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function el(tag, attrs, ...kids){ const e=document.createElement(tag); for(const k in (attrs||{})){ if(attrs[k]==null||attrs[k]===false) continue; if(k==="class") e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } for(const k of kids){ if(k==null) continue; e.append(k.nodeType? k : document.createTextNode(k)); } return e; }

/* ---------- routing ---------- */
function route(){
  const v = location.hash === "#quiz" ? "quiz" : "cards";
  document.getElementById("view-cards").hidden = v!=="cards";
  document.getElementById("view-quiz").hidden = v!=="quiz";
  document.getElementById("tab-cards").setAttribute("aria-current", v==="cards"?"page":"false");
  document.getElementById("tab-quiz").setAttribute("aria-current", v==="quiz"?"page":"false");
}
window.addEventListener("hashchange", route);

/* ---------- flash cards ---------- */
const cs = {ch: ALL, mode: "learn", queue: [], idx: 0, flipped: false};
function pool(){ return cards.filter(c => cs.ch===ALL || c.ch===cs.ch); }
function mastered(c){ return (store.boxes[c.id]||0) >= 2; }
function buildQueue(){
  cs.flipped=false; cs.idx=0;
  cs.queue = cs.mode==="learn" ? shuffle(pool().filter(c=>!mastered(c))) : pool().slice();
}
function chips(container, list, current, onPick){
  container.innerHTML="";
  for(const name of list){
    container.append(el("button",{type:"button",class:"chip","aria-pressed":String(name===current),onclick:()=>onPick(name)},name));
  }
}
function renderCardChips(){ chips(document.getElementById("card-chips"), [ALL].concat(DATA.chapters), cs.ch, n=>{cs.ch=n; buildQueue(); renderCards();}); }
function renderProgress(){
  const p=pool(), m=p.filter(mastered).length;
  document.getElementById("card-bar").style.width = (p.length? (m/p.length*100):0)+"%";
  document.getElementById("card-ptext").textContent = cs.mode==="learn"
    ? `${m} of ${p.length} cards mastered. A card is mastered after you get it right twice in a row.`
    : `Card ${Math.min(cs.idx+1,cs.queue.length)} of ${cs.queue.length}. ${m} of ${p.length} mastered.`;
}
function renderCards(){
  renderCardChips(); renderProgress();
  document.getElementById("mode-learn").setAttribute("aria-pressed", String(cs.mode==="learn"));
  document.getElementById("mode-browse").setAttribute("aria-pressed", String(cs.mode==="browse"));
  const area=document.getElementById("card-area"); area.innerHTML="";
  const c = cs.queue[cs.idx];
  if(!c){
    const p=pool();
    area.append(el("div",{class:"done"},
      el("div",{class:"big"}, `${p.filter(mastered).length}/${p.length}`),
      el("div",{}, cs.ch===ALL? "You've mastered every card. Nice work." : `You've mastered every card in ${cs.ch}.`),
      el("button",{type:"button",class:"btn primary",onclick:()=>{ for(const x of p) delete store.boxes[x.id]; save(); buildQueue(); renderCards(); }},"Study these again")));
    return;
  }
  const front = el("div",{class:"face front"},
    el("div",{class:"ch"}, c.ch),
    c.img ? el("img",{src:c.img, alt:"Cross-section drawing of a pore at one stage of acne"}) : null,
    el("div",{class:"txt"}, c.f),
    el("div",{class:"hint"}, "Tap the card to flip it"));
  const back = el("div",{class:"face back"},
    el("div",{class:"ch"}, c.ch),
    el("div",{class:"txt"}, c.b),
    el("div",{class:"hint"}, "Tap to see the question again"));
  const card = el("button",{type:"button",class:"card"+(cs.flipped?" flipped":""),"aria-label":"Flash card. Activate to flip.",onclick:()=>{cs.flipped=!cs.flipped; card.classList.toggle("flipped",cs.flipped); syncActions();}},
    el("div",{class:"inner"}, front, back));
  area.append(card);
  const actions = el("div",{class:"actions",style:"margin-top:14px"});
  if(cs.mode==="learn"){
    const a=el("button",{type:"button",class:"btn learn",onclick:()=>answer(false)},"Still learning");
    const b=el("button",{type:"button",class:"btn got",onclick:()=>answer(true)},"Got it");
    actions.append(a,b);
  } else {
    actions.append(
      el("button",{type:"button",class:"btn",onclick:()=>{ if(cs.idx>0){cs.idx--; cs.flipped=false; renderCards();}}, disabled:cs.idx===0?"":null},"Previous"),
      el("button",{type:"button",class:"btn primary",onclick:()=>{ cs.idx=(cs.idx+1)%cs.queue.length; cs.flipped=false; renderCards();}},"Next"));
  }
  if(cs.idx===0 && cs.mode==="browse") actions.firstChild.disabled=true;
  area.append(actions);
  if(cs.mode==="browse") area.append(el("button",{type:"button",class:"link",onclick:()=>{cs.queue=shuffle(cs.queue); cs.idx=0; cs.flipped=false; renderCards();}},"Shuffle these cards"));
  function syncActions(){ if(cs.mode==="learn") for(const b of actions.querySelectorAll("button")) b.disabled=!cs.flipped; }
  syncActions();
}
function answer(knew){
  const c=cs.queue[cs.idx];
  if(knew){ store.boxes[c.id]=(store.boxes[c.id]||0)+1; }
  else { store.boxes[c.id]=0; }
  save();
  cs.queue.splice(cs.idx,1);
  if(!mastered(c)){ const pos=Math.min(cs.queue.length, cs.idx + (knew? 6 : 3)); cs.queue.splice(pos,0,c); }
  if(cs.idx>=cs.queue.length) cs.idx=0;
  cs.flipped=false; renderCards();
}
document.getElementById("mode-learn").onclick=()=>{cs.mode="learn"; buildQueue(); renderCards();};
document.getElementById("mode-browse").onclick=()=>{cs.mode="browse"; buildQueue(); renderCards();};
document.getElementById("reset-cards").onclick=()=>{ for(const x of pool()) delete store.boxes[x.id]; save(); buildQueue(); renderCards(); };

/* ---------- quiz ---------- */
const qs = {ch: ALL, scOnly:false, round:null};
const QCH = [ALL].concat(DATA.chapters.filter(c=>c!=="Picture cards"));
function qpool(){ return quiz.filter(q => (qs.ch===ALL || q.ch===qs.ch) && (!qs.scOnly || q.sc)); }
function startRound(list){
  const qsList = list || shuffle(qpool()).slice(0,10);
  qs.round = {list: qsList, i:0, score:0, missed:[], picked:null, order: qsList.map(q=>shuffle(q.o.map((_,k)=>k)))};
  renderQuiz();
}
function renderQuizChips(){ chips(document.getElementById("quiz-chips"), QCH, qs.ch, n=>{qs.ch=n; qs.round=null; renderQuiz();}); }
function bestKey(){ return qs.ch + (qs.scOnly? " (scenarios)" : ""); }
function renderQuiz(){
  renderQuizChips();
  const area=document.getElementById("quiz-area"); area.innerHTML="";
  const p=qpool();
  if(!qs.round){
    const best=store.best[bestKey()];
    area.append(el("div",{class:"done"},
      el("div",{}, `${p.length} question${p.length===1?"":"s"} in ${qs.ch===ALL?"all chapters":qs.ch}${qs.scOnly?", client scenarios only":""}. Each round asks up to 10, with an explanation after every answer.`),
      best!=null ? el("div",{class:"ptext"}, `Best score here: ${best}%`) : null,
      el("button",{type:"button",class:"btn primary",onclick:()=>startRound(), disabled: p.length? null : ""}, p.length? "Start the quiz" : "No questions here yet")));
    return;
  }
  const r=qs.round;
  if(r.i>=r.list.length){
    const pct=Math.round(r.score/r.list.length*100);
    const k=bestKey(); if(store.best[k]==null || pct>store.best[k]){ store.best[k]=pct; save(); }
    const box=el("div",{class:"done"},
      el("div",{class:"big"}, `${r.score}/${r.list.length}`),
      el("div",{}, pct===100? "Perfect round." : pct>=80? "Strong round. Review the misses below." : "Keep going. The misses below are the ones to study."));
    if(r.missed.length){
      const m=el("div",{class:"missed"});
      for(const q of r.missed) m.append(el("div",{}, el("div",{},q.q), el("div",{class:"ans"},"Answer: "+q.o[q.a]), el("div",{class:"ptext"},q.w)));
      box.append(m);
      box.append(el("button",{type:"button",class:"btn primary",onclick:()=>startRound(shuffle(r.missed))},"Retry the ones I missed"));
    }
    box.append(el("button",{type:"button",class:"btn",onclick:()=>startRound()},"New round"));
    area.append(box); return;
  }
  const q=r.list[r.i], ord=r.order[r.i];
  const head=el("div",{class:"row"}, el("span",{class:"ptext"},`Question ${r.i+1} of ${r.list.length}`), el("span",{class:"ptext"},`Score ${r.score}`));
  const card=el("div",{class:"q"}, head);
  card.append(el("span",{class:"tag"}, q.sc? "Client scenario" : q.ch));
  card.append(el("h2",{}, q.q));
  const opts=el("div",{class:"opts"});
  ord.forEach((k,n)=>{
    const b=el("button",{type:"button",class:"opt",onclick:()=>pick(k)}, el("span",{class:"k"},"ABCD"[n]), el("span",{},q.o[k]));
    if(r.picked!=null){ b.disabled=true; if(k===q.a) b.classList.add("right"); else if(k===r.picked) b.classList.add("wrong"); }
    opts.append(b);
  });
  card.append(opts);
  if(r.picked!=null){
    card.append(el("div",{class:"why"}, el("b",{}, r.picked===q.a? "Correct." : "Not quite."), q.w));
    card.append(el("button",{type:"button",class:"btn primary",onclick:()=>{r.i++; r.picked=null; renderQuiz();}}, r.i+1<r.list.length? "Next question" : "See my score"));
  }
  area.append(card);
  function pick(k){ if(r.picked!=null) return; r.picked=k; if(k===q.a) r.score++; else r.missed.push(q); renderQuiz(); }
}
document.getElementById("sc-only").onchange=e=>{qs.scOnly=e.target.checked; qs.round=null; renderQuiz();};

route(); buildQueue(); renderCards(); renderQuiz();
</script>
</body>
</html>
